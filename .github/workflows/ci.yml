name: Auditoría y calidad

on:
  push:
    branches: [main, master, 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1 · Higiene del repositorio (secretos, JSON, ficheros sensibles)
  # ---------------------------------------------------------------------------
  higiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Sin ficheros de credenciales versionados
        run: |
          fail=0
          tracked=$(git ls-files)
          for pattern in '\.env$' '\.env\.[a-z]+$' '\.pem$' '\.p12$' '\.pfx$' 'id_rsa$' 'id_ed25519$' '\.keystore$' '\.npmrc$' '\.netrc$'; do
            hits=$(echo "$tracked" | grep -E "$pattern" || true)
            if [ -n "$hits" ]; then
              echo "::error file=.env::Fichero sensible versionado ($pattern):"
              echo "$hits"
              fail=1
            fi
          done
          exit $fail

      - name: Sin patrones de credenciales en el contenido
        run: |
          fail=0
          if git ls-files -z \
            | xargs -0 -r grep -IEn \
                '(sk-ant-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{30,}|gh[pousr]_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}|GOCSPX-[A-Za-z0-9_-]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' \
            2>/dev/null; then
            echo "::error::Se han encontrado patrones de credenciales. Rótalas y limpia el historial."
            fail=1
          fi
          exit $fail

      - name: JSON válido
        run: |
          fail=0
          for f in $(git ls-files '*.json' | grep -v 'package-lock.json'); do
            python3 -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))" "$f" \
              || { echo "::error file=$f::JSON no parseable"; fail=1; }
          done
          exit $fail

  # ---------------------------------------------------------------------------
  # 2 · Construcción reproducible + auditorías del sitio
  # ---------------------------------------------------------------------------
  auditoria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Instalar dependencias de desarrollo
        run: npm ci --prefix tools --no-audit --no-fund

      - name: La construcción no debe producir diferencias
        run: |
          npm --prefix tools run build:pages
          if ! git diff --quiet -- '*.html'; then
            echo "::error::Los HTML no coinciden con el resultado de la construcción."
            echo "Ejecuta «npm --prefix tools run build:pages» y confirma el resultado antes de subir."
            git diff --stat -- '*.html'
            exit 1
          fi
          echo "Construcción reproducible: los HTML están sincronizados."

      - name: Validez del marcado (html-validate)
        run: npm --prefix tools run audit:html

      - name: Estilo de las hojas de estilo (stylelint)
        run: npm --prefix tools run audit:css

      - name: Accesibilidad (axe-core + comprobaciones propias)
        run: npm --prefix tools run audit:a11y

      - name: Enlaces y recursos
        run: npm --prefix tools run audit:links

      - name: SEO técnico y presupuesto de rendimiento
        run: npm --prefix tools run audit:quality

      - name: Material multimedia (contenedor, referencias y duplicados)
        run: npm --prefix tools run audit:media

      - name: Prueba funcional (jsdom con los scripts reales)
        run: node tools/audit/smoke.mjs

      - name: Resumen
        if: always()
        run: |
          {
            echo "### Auditoría CARQUIDEC"
            echo ""
            echo "- Marcado: html-validate"
            echo "- Estilos: stylelint"
            echo "- Accesibilidad: axe-core (WCAG 2.1 AA) + contraste calculado"
            echo "- Enlaces: integridad de enlaces, anclas y recursos"
            echo "- Calidad: SEO técnico y presupuesto de rendimiento"
            echo "- Material: contenedor real, referencias y duplicados"
            echo "- Funcional: arranque real de la web en jsdom"
            echo ""
            echo "Ficheros auditados: $(git ls-files '*.html' | wc -l) HTML · $(git ls-files 'assets/css/*.css' | wc -l) CSS"
          } >> "$GITHUB_STEP_SUMMARY"
