name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  smoke:
    name: Humo del repositorio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Instalar dependencias
        run: npm ci || npm install
      - name: Build (informativo)
        #Este repositorio es mayoritariamente estatico y su build no es
        # reproducible desde un runner limpio. Se ejecuta de forma advisory:
        # informa del estado real sin poner el repo entero en rojo.
        run: npm run build --if-present
        continue-on-error: true
      - name: Ficheros JSON validos
        run: |
          mal=0
          for f in $(git ls-files '*.json' | head -50); do
            if ! node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f" 2>/dev/null; then
              echo "::warning file=$f::JSON no parseable"
              mal=1
            fi
          done
          [ "$mal" -eq 0 ] && echo "ok   JSON valido"
