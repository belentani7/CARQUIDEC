<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CARQUIDEC — Logo 3D Medallon</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;font-family:'Cormorant Garamond',serif}

.container{text-align:center;position:relative}

/* MEDALLON 3D */
.medallon{
width:350px;height:350px;
margin:0 auto 50px;
perspective:1000px;
position:relative;
}
.medallon-inner{
width:100%;height:100%;
position:relative;
transform-style:preserve-3d;
animation:medallonSpin 8s cubic-bezier(.4,0,.2,1) infinite;
}
.medallon-face{
position:absolute;inset:0;
display:flex;align-items:center;justify-content:center;
backface-visibility:hidden;
border-radius:50%;
overflow:hidden;
}
.medallon-face img{
width:100%;height:100%;object-fit:contain;
padding:20px;
filter:drop-shadow(0 0 30px rgba(184,168,138,0.5));
}
.medallon-front{transform:translateZ(25px)}
.medallon-back{transform:rotateY(180deg) translateZ(25px)}
.medallon-edge{
position:absolute;
width:100%;height:100%;
border-radius:50%;
background:linear-gradient(135deg,#8a7a5a,#b8a88a,#8a7a5a);
transform:translateZ(0px);
box-shadow:
0 0 60px rgba(184,168,138,0.4),
inset 0 0 40px rgba(0,0,0,0.3),
0 0 120px rgba(184,168,138,0.2);
}

@keyframes medallonSpin{
0%{transform:rotateY(0deg) rotateX(5deg)}
25%{transform:rotateY(90deg) rotateX(-3deg)}
50%{transform:rotateY(180deg) rotateX(5deg)}
75%{transform:rotateY(270deg) rotateX(-3deg)}
100%{transform:rotateY(360deg) rotateX(5deg)}
}

/* BRILLO */
.shine{
position:absolute;
width:100%;height:100%;
border-radius:50%;
background:linear-gradient(135deg,transparent 30%,rgba(255,255,255,0.1) 50%,transparent 70%);
animation:shineRotate 4s linear infinite;
pointer-events:none;
}
@keyframes shineRotate{
0%{transform:rotate(0deg)}
100%{transform:rotate(360deg)}
}

/* ANILLO EXTERIOR */
.ring{
position:absolute;
width:380px;height:380px;
top:50%;left:50%;
transform:translate(-50%,-50%);
border-radius:50%;
border:1px solid rgba(184,168,138,0.2);
animation:ringPulse 3s ease-in-out infinite;
pointer-events:none;
}
.ring::after{
content:'';position:absolute;inset:8px;
border-radius:50%;
border:1px solid rgba(184,168,138,0.1);
}
@keyframes ringPulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:0.5}50%{transform:translate(-50%,-50%) scale(1.05);opacity:1}}

/* TEXTO */
.text-3d{
font-size:clamp(1.8rem,4vw,3rem);
font-weight:700;
letter-spacing:0.4em;
text-transform:uppercase;
background:linear-gradient(135deg,#c9c9c9 0%,#b8a88a 50%,#c9c9c9 100%);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
background-clip:text;
opacity:0;
animation:textIn 1.5s ease-out 1s forwards;
transform:translateY(30px);
}
@keyframes textIn{to{opacity:1;transform:translateY(0)}}

.subtitle{
font-size:clamp(0.7rem,1.2vw,0.9rem);
letter-spacing:0.5em;
text-transform:uppercase;
color:#777;
margin-top:8px;
opacity:0;
animation:textIn 1s ease-out 1.5s forwards;
transform:translateY(20px);
}

.line{
width:0;height:1px;
background:linear-gradient(90deg,transparent,#b8a88a,transparent);
margin:24px auto;
animation:lineW 1.5s ease-out 1.2s forwards;
}
@keyframes lineW{to{width:250px}}

.btn-enter{
display:inline-block;
margin-top:30px;
padding:14px 40px;
border:1px solid rgba(184,168,138,0.3);
color:#b8a88a;
font-family:'Cormorant Garamond',serif;
font-size:11px;
letter-spacing:0.3em;
text-transform:uppercase;
text-decoration:none;
background:transparent;
opacity:0;
animation:textIn 1s ease-out 2s forwards;
cursor:pointer;
transition:all .4s;
}
.btn-enter:hover{background:rgba(184,168,138,0.1);border-color:#b8a88a}

/* PARTICLES */
.particles{position:fixed;inset:0;pointer-events:none;z-index:-2}
.p{position:absolute;width:1px;height:1px;background:rgba(184,168,138,0.3);border-radius:50%;animation:pFloat linear infinite}
@keyframes pFloat{
0%{transform:translateY(100vh);opacity:0}
10%{opacity:1}
90%{opacity:1}
100%{transform:translateY(-10vh);opacity:0}
}

/* GLOW */
.glow{
position:absolute;width:500px;height:500px;
top:50%;left:50%;
transform:translate(-50%,-60%);
background:radial-gradient(circle,rgba(184,168,138,0.08),transparent 60%);
animation:glowP 5s ease-in-out infinite;
pointer-events:none;z-index:-1;
}
@keyframes glowP{0%,100%{transform:translate(-50%,-60%) scale(1);opacity:0.4}50%{transform:translate(-50%,-60%) scale(1.3);opacity:0.8}}
</style>
</head>
<body>

<div class="particles" id="particles"></div>
<div class="glow"></div>

<div class="container">
<div class="medallon">
<div class="ring"></div>
<div class="medallon-inner">
<div class="medallon-face medallon-front">
<img src="logo-carquidec-transparent.png" alt="CARQUIDEC">
</div>
<div class="medallon-face medallon-back">
<img src="logo-carquidec-transparent.png" alt="CARQUIDEC">
</div>
<div class="medallon-edge"></div>
<div class="shine"></div>
</div>
</div>

<div class="text-3d">CARQUIDEC</div>
<div class="subtitle">Arquitectura & Decoracion</div>
<div class="line"></div>
<a href="index.html" class="btn-enter">Entrar al Portfolio</a>
</div>

<script>
// Particulas
const c=document.getElementById('particles');
for(let i=0;i<50;i++){
const d=document.createElement('div');d.className='p';
d.style.left=Math.random()*100+'%';
d.style.animationDuration=(6+Math.random()*12)+'s';
d.style.animationDelay=Math.random()*8+'s';
d.style.width=d.style.height=(1+Math.random()*1.5)+'px';
c.appendChild(d);
}

// Mouse glow follow
document.addEventListener('mousemove',e=>{
const g=document.querySelector('.glow');
g.style.left=e.clientX+'px';
g.style.top=(e.clientY-100)+'px';
g.style.transform='translate(-50%,-50%) scale(1)';
});

// Scroll pause
let sy=0;
window.addEventListener('scroll',()=>{
sy=window.scrollY;
const m=document.querySelector('.medallon-inner');
if(m)m.style.animationPlayState=sy>50?'paused':'running';
});
</script>
</body>
</html>
